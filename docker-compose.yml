services:
  mariadb:
    image: mariadb:lts-ubi
    restart: always
    ports:
      - "3306:3306"
    networks:
      - db-network
    volumes:
      - ./mariadb:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

  postgres:
    image: postgres:14.18
    restart: always
    ports:
      - "5432:5432"
    networks:
      - db-network
    volumes:
      - ./postgresql:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080
    networks:
      - db-network

networks:
  db-network:
    driver: bridge
