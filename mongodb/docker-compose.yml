services:
  mongo:
    container_name: mongodb
    image: mongodb/mongodb-community-server:latest
    restart: always
    ports:
      - "27017:27017" # Expose MongoDB on the default port
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME} # Admin username
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD} # Admin password
    volumes:
      - ./mongo-data:/data/db # Persist MongoDB data
      - ./mongo-config:/data/configdb # Persist configuration files
