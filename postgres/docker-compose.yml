services:
  databasus:
    container_name: databasus
    image: databasus/databasus:latest
    ports:
      - "4005:4005"
    networks:
      - postgres-network
    restart: unless-stopped
    volumes:
      - ./databasus-data:/databasus-data

  adminer:
    image: adminer
    ports:
      - 8080:8080
    networks:
      - postgres-network
    restart: unless-stopped

  postgrest:
    image: postgrest/postgrest
    ports:
      - "3000:3000"
    networks:
      - postgres-network
    restart: unless-stopped
    environment:
      PGRST_SERVER_HOST: 0.0.0.0 # necessary for `postgrest --ready` flag to work
      PGRST_DB_URI: postgres://${POSTGREST_API_USER}:${POSTGREST_API_PASSWORD}@postgres_svc:5432/postgres
      PGRST_OPENAPI_SERVER_PROXY_URI: http://127.0.0.1:3000
    depends_on:
      - postgres_svc

  swagger:
    image: swaggerapi/swagger-ui
    ports:
      - "8000:8080"
    networks:
      - postgres-network
    restart: unless-stopped
    environment:
      API_URL: http://postgrest:3000
    depends_on:
      - postgrest

  postgres_svc:
    image: postgres:18
    ports:
      - "5432:5432"
    networks:
      - postgres-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

networks:
  postgres-network:
    driver: bridge
